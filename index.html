<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#04070d" />
    <title>Artifact Room // Research Sector 07</title>
  </head>
  <body>
    <canvas class="webgl"></canvas>
    <main class="interface" aria-label="Artifact room status">
      <div class="brand-mark">
        <span class="brand-kicker">RESEARCH SECTOR 07</span>
        <h1>SCI-FI ARTIFACT ROOM</h1>
      </div>
      <div class="status-panel">
        <span class="status-dot"></span>
        <span>CONTAINMENT ACTIVE</span>
      </div>
      <aside class="artifact-panel">
        <span class="panel-label">SPECIMEN // A-07</span>
        <strong>ENERGY ARTIFACT</strong>
        <span class="panel-data">CORE TEMP · 042.8 K</span>
        <span class="panel-data">FIELD OSCILLATION · NOMINAL</span>
      </aside>
      <div class="hint">
        DRAG TO ORBIT <span>/</span> SCROLL TO ZOOM <span>/</span> CLICK
        CONTAINERS TO IMPULSE
      </div>
      <div class="decorative-indicators" aria-hidden="true">
        <i></i><i></i><i></i><i></i>
      </div>
    </main>
    <link rel="stylesheet" href="/src/styles.css" />
    <script type="module" src="/src/script.js"></script>
  </body>
</html>
